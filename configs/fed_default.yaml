# FedMAGNN default configuration
# Model/loss sections mirror magnn_improved's per-dataset configs (all four
# datasets used identical model hyperparameters there).

dataset:
  num_snapshots: 5

model:
  hidden_dim: 128
  num_heads: 4
  num_layers: 3
  dropout: 0.1
  edge_dim: 4

training:
  lr: 0.001
  weight_decay: 1.0e-5
  dirichlet_size: 30
  dirichlet_alpha: 1.0
  augment_drop_ratio: 0.1
  augment_add_ratio: 0.1
  rwr_restart_prob: 0.15
  rwr_steps: 100

loss:
  lambda1: 1.0
  lambda2: 1.0
  lambda3: 1.0
  alpha: 2.0
  beta: 0.5
  temperature: 0.07

magnn_plus:
  pe_dim: 64
  walk_length: 16
  max_degree: 512
  focal_gamma: 2.0
  label_smoothing: 0.05
  scheduler_type: cosine_warm_restart
  cross_dataset: false

federated:
  rounds: 50            # communication rounds
  local_epochs: 2       # local epochs per round (50*2 = 100 epoch-equivalents,
                        # matching the centralized budget)
  share_mode: encoder   # encoder | full
  fedprox_mu: 0.01      # used only in --mode fedprox
  # Cross-silo prototype alignment
  align: false          # enabled via --align
  align_weight: 0.5
  align_temperature: 0.1
  proto_clip: 1.0
  # Differential privacy (0 = off)
  dp_sigma: 0.0
  dp_clip: 1.0
  dp_delta: 1.0e-5

# Reference points for the results table
targets:
  centralized_magnn_plus:   # from MAGNN/magnn_improved results ([accuracy, f1])
    ctu13:   [97.26, 97.74]
    cicids:  [99.55, 99.64]
    dohbrw:  [100.00, 100.00]
    iscxvpn: [100.00, 100.00]
